<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Bruce 的 AI 影音與生成式創作">
  <title>AI Creative Lab｜Bruce</title>
  <style>
    :root {
      --navy: #0f172a;
      --teal: #0d9488;
      --teal-hover: #0f766e;
      --teal-light: #ccfbf1;
      --muted: #64748b;
      --line: #e2e8f0;
      --card-shadow: 0 5px 20px #0f172a0a;
      --card-shadow-hover: 0 16px 35px -6px rgba(13, 148, 136, 0.15);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      color: #334155;
      background: #f8fafc;
      line-height: 1.65
    }

    a {
      color: var(--teal)
    }

    /* 頂部微動態效果 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    nav {
      background: var(--navy);
      padding: 14px max(22px, calc((100vw - 1120px)/2));
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap
    }

    nav a {
      color: white;
      text-decoration: none
    }

    .brand {
      font-weight: 800
    }

    .hero {
      background: linear-gradient(125deg, #0f172a, #1e293b);
      color: white;
      padding: 65px 22px;
      animation: fadeInUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .container {
      max-width: 1120px;
      margin: auto
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      margin: 8px 0
    }

    .hero p {
      max-width: 730px;
      color: #cbd5e1
    }

    .eyebrow {
      color: #5eead4;
      letter-spacing: .12em;
      font-weight: 800;
      font-size: .8rem
    }

    main {
      padding: 52px 22px 70px
    }

    h2 {
      color: var(--navy)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-top: 28px
    }

    /* 調整 2：優化作品卡片互動 */
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      min-width: 0;
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .3s cubic-bezier(0.16, 1, 0.3, 1), border-color .3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--teal);
    }

    .visual {
      aspect-ratio: 16/9;
      background: linear-gradient(130deg, #16233d, #0b615d);
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white
    }

    .visual.playable {
      cursor: pointer
    }

    .visual video,
    .visual img.cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .visual img.cover {
      position: absolute;
      inset: 0
    }

    .visual iframe {
      width: 100%;
      height: 100%;
      border: 0;
      position: absolute;
      inset: 0
    }

    .placeholder {
      text-align: center;
      padding: 16px;
      font-weight: 800
    }

    .placeholder b {
      font-size: 2rem;
      display: block
    }

    .play-mark {
      position: relative;
      z-index: 1;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #0f172ae6;
      border: 2px solid #ffffffcc;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      pointer-events: none;
      box-shadow: 0 8px 24px #0006;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .visual.playable:hover .play-mark {
      transform: scale(1.08);
      background: #0d9488e6
    }

    .pill {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: #0f172ad9;
      color: white;
      border-radius: 30px;
      padding: 4px 11px;
      font-size: .75rem;
      pointer-events: none;
      z-index: 1
    }

    .card-body {
      padding: 20px
    }

    .type {
      font-size: .72rem;
      color: var(--teal);
      letter-spacing: .1em;
      font-weight: 800
    }

    .card h3 {
      font-size: 1.1rem;
      color: var(--navy);
      margin: 8px 0
    }

    .card p {
      font-size: .9rem;
      color: var(--muted);
      margin: 0 0 16px
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .actions a,
    .actions button {
      font: inherit;
      font-size: .88rem;
      font-weight: 750;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      color: var(--teal);
      text-decoration: none
    }

    .actions a:hover,
    .actions button:hover {
      text-decoration: underline
    }

    .banner {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 16px 0 0
    }

    .card.is-active {
      outline: 3px solid var(--teal);
      outline-offset: 2px
    }

    footer {
      background: var(--navy);
      color: #cbd5e1;
      padding: 25px 22px
    }

    footer .container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px
    }

    footer a {
      color: #99f6e4
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:600px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .hero {
        animation: none !important;
      }

      *,
      *:before,
      *:after {
        scroll-behavior: auto !important;
        animation: none !important
      }
    }

    .more-works {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 0;
      padding: 8px 16px 8px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      box-shadow: 0 5px 20px #0f172a0a;
      color: var(--navy);
      font-size: .92rem;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .more-works .mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #0d9488);
      color: white
    }

    .more-works:hover {
      border-color: var(--teal);
      color: var(--teal);
      transform: translateY(-2px);
    }

    .gallery-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap
    }

    .gallery-head .more-works {
      margin: 0
    }

    /* 調整 3：過濾標籤 (Filter Tags 樣式) */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 24px 0 8px;
    }

    .filter-btn {
      background: white;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .filter-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    .player-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .player-modal[hidden] {
      display: none !important;
    }

    .player-modal-backdrop {
      position: absolute;
      inset: 0;
      background: #0f172acc;
    }

    .player-modal-box {
      position: relative;
      width: min(960px, 100%);
      background: #0f172a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px #0008;
    }

    .player-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
    }

    .player-modal-head h2 {
      margin: 0;
      font-size: 1rem;
      color: #fff;
    }

    .player-modal-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #ffffff22;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .player-modal-close:hover {
      background: var(--teal);
    }

    .player-modal-stage {
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-modal-stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <nav><a class="brand" href="index.html">Bruce｜作品履歷</a><a href="index.html#s13">← 返回主履歷</a>
  </nav>
  <header class="hero">
    <div class="container">
      <div class="eyebrow">ADDITIONAL CREATIVE WORK · 2025</div>

  <main class="container">
    <div class="gallery-head">

      <a class="more-works"
        href="https://drive.google.com/drive/u/1/folders/1twv-KW6XhwPGOvxCF52Xrc-3IzT8LRl2?dmr=1&amp;ec=wgc-drive-%5Bmodule%5D-goto"
        target="_blank" rel="noopener noreferrer">
        <span class="mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />

        其他 AI 作品

  <div id="player-modal" class="player-modal" hidden>
    <div class="player-modal-backdrop" data-close-modal></div>
    <div class="player-modal-box" role="dialog" aria-modal="true" aria-labelledby="player-modal-title">
      <header class="player-modal-head">

  <script>
    const works = [
      { title: "MV-你不是真的懂", platform: "drive", url: "https://drive.google.com/file/d/1JAUfD_6UCAJHvNv1GLxpDXex3FfSVWUu/view?usp=drive_link", preview: "", description: "MV試做，結合Suno,Sora...等工具" },//01
      { title: "PUBG CAT", platform: "drive", url: "https://drive.google.com/file/d/1G1zz7ok4L49SVTxgVc0w5NuuotVOKCME/view?usp=drive_link", preview: "", description: "Winner Winner Fish Dinner" },//02
      { title: "火影忍者", platform: "drive", url: "https://drive.google.com/file/d/1-c2svYP05wgA9pQg0pTqOBFwQ5ezEu_j/view?usp=drive_link", preview: "", description: "火影忍者真人模擬" },//03
      { title: "RAP Budaha", platform: "drive", url: "https://drive.google.com/file/d/11jd_7jGacbY0iIEG08cpo63GnIwk0lOU/view?usp=drive_link", preview: "", description: "將楞嚴咒重新編曲，以RAP呈現" },//04
      { title: "ZenbreathEchoes 佛教經文 AI 編曲", platform: "youtube", url: "https://www.youtube.com/@ZenbreathEchoes", preview: "", description: "曲風調整練習" },//06
      { title: "YesIamAI 原創 MV & 短片創作", platform: "youtube", url: "https://www.youtube.com/@YesIamAiTW", preview: "", description: "提示詞操作練習" }//07
    ];

    const PREVIEW_MS = 10000;
    const gallery = document.getElementById("gallery");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const openedAsFile = location.protocol === "file:";
    const playerModal = document.getElementById("player-modal");
    const playerModalTitle = document.getElementById("player-modal-title");
    const playerModalStage = document.getElementById("player-modal-stage");
    const cards = [];
    let rotationTimer = 0;
    let activeSlot = -1;
    let userTookOver = false;
    let currentFilter = "all";

    function youtubeId(url) {
      try {
        const u = new URL(url);
        if (u.hostname === "youtu.be") return u.pathname.slice(1).split("/")[0];
        if (u.hostname.endsWith("youtube.com")) {
          if (u.pathname === "/watch") return u.searchParams.get("v");
          if (u.pathname.startsWith("/shorts/") || u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2];
        }
      } catch (e) { }
      return null;
    }

    function youtubeStart(url) {
      try {
        const u = new URL(url);
        const t = u.searchParams.get("t") || u.searchParams.get("start") || "0";
        if (/^\d+$/.test(t)) return +t;
        const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
        return m ? (+(m[1] || 0) * 3600 + +(m[2] || 0) * 60 + +(m[3] || 0)) : 0;
      } catch (e) {
        return 0;
      }
    }

    function driveFileId(url) {
      try {
        const u = new URL(url);
        if (/\/folders\//.test(u.pathname)) return null;
        const m = u.pathname.match(/\/file\/d\/([^/]+)/);
        if (m) return m[1];
        return u.searchParams.get("id");
      } catch (e) { }
      return null;
    }

    function driveFolderId(url) {
      try {
        const m = new URL(url).pathname.match(/\/folders\/([^/]+)/);
        return m ? m[1] : null;
      } catch (e) { }
      return null;
    }

    function el(tag, cls, txt) {
      const x = document.createElement(tag);
      if (cls) x.className = cls;
      if (txt) x.textContent = txt;
      return x;
    }

    function makePlaceholder(platform, message) {
      const ph = el("div", "placeholder");
      ph.append(el("b", "", platform === "youtube" ? "▶" : "▣"), document.createTextNode(message || (platform === "youtube" ? "YOUTUBE" : "GOOGLE DRIVE")));
      return ph;
    }

    function makeCover(src, title) {
      const img = el("img", "cover");
      img.src = src;
      img.alt = title;
      img.referrerPolicy = "no-referrer";
      return img;
    }

    function youtubeFrame(id, start, mode) {
      const frame = el("iframe");
      frame.title = mode.title;
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
      frame.setAttribute("allowfullscreen", "");
      const q = new URLSearchParams({
        autoplay: "1",
        mute: mode.muted ? "1" : "0",
        controls: mode.controls ? "1" : "0",
        start: String(start || 0),
        rel: "0",
        modestbranding: "1",
        playsinline: "1"
      });
      if (mode.end != null) q.set("end", String(mode.end));
      frame.src = "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?" + q.toString();
      return frame;
    }

    function driveFrame(fileId, title) {
      const frame = el("iframe");
      frame.title = title;
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
      frame.setAttribute("allowfullscreen", "");
      frame.src = "https://drive.google.com/file/d/" + encodeURIComponent(fileId) + "/preview";
      return frame;
    }

    function localVideo(src, title, muted) {
      const v = el("video");
      v.src = src;
      v.muted = muted;
      v.defaultMuted = muted;
      v.playsInline = true;
      v.controls = !muted;
      v.preload = "metadata";
      v.setAttribute("playsinline", "");
      if (muted) v.setAttribute("muted", "");
      v.setAttribute("aria-label", title);
      return v;
    }

    function paintCover(card) {
      const visual = card.visual;
      visual.classList.remove("playable");
      visual.replaceChildren();
      if (card.preview) {
        visual.append(makePlaceholder(card.platform, "MP4 預覽"), el("span", "pill", "輪到時靜音播放 10 秒"));
        return;
      }
      if (card.kind === "youtube") {
        const img = makeCover("https://i.ytimg.com/vi/" + card.youtubeId + "/hqdefault.jpg", card.title);
        img.addEventListener("error", () => img.remove());
        visual.append(img, el("div", "play-mark", "▶"), el("span", "pill", "靜音預覽 10 秒"));
        visual.classList.add("playable");
        return;
      }
      if (card.kind === "drive") {
        const img = makeCover("https://drive.google.com/thumbnail?id=" + encodeURIComponent(card.fileId) + "&sz=w1280", card.title);
        img.addEventListener("error", () => img.remove());
        visual.append(img, el("div", "play-mark", "▶"), el("span", "pill", "點此放大播放"));
        visual.classList.add("playable");
        return;
      }
      visual.append(makePlaceholder(card.platform, card.folder ? "DRIVE 資料夾" : ""), el("span", "pill", "點擊下方連結觀看"));
    }

    function showPlayer(card, node, pill) {
      card.visual.classList.remove("playable");
      card.visual.replaceChildren(node);
      if (pill) card.visual.append(el("span", "pill", pill));
    }

    function stopCard(card) {
      card.root.classList.remove("is-active");
      if (card.media) {
        card.media.pause();
        card.media.removeAttribute("src");
        card.media.load();
        card.media = null;
      }
      paintCover(card);
    }

    function stopRotation() {
      clearTimeout(rotationTimer);
      rotationTimer = 0;
    }

    function previewCard(card) {
      cards.forEach(other => { if (other.root.classList.contains("is-active") || other.media) stopCard(other); });
      card.root.classList.add("is-active");
      if (card.preview) {
        const v = localVideo(card.preview, card.title, true);
        card.media = v;
        v.addEventListener("error", () => showPlayer(card, el("div", "placeholder", "預覽影片載入失敗，請檢查 MP4 路徑")));
        showPlayer(card, v, "靜音預覽 10 秒");
        v.play().catch(() => { });
        return;
      }
      const start = card.start || 0;
      showPlayer(card, youtubeFrame(card.youtubeId, start, {
        title: card.title,
        muted: true,
        controls: false,
        end: start + 10
      }), "靜音預覽 10 秒");
    }

    function nextPreview() {
      const visibleCards = cards.filter(card => card.root.style.display !== "none");
      const queue = visibleCards.filter(card => card.autoplay);
      if (!queue.length || userTookOver || reducedMotion.matches || openedAsFile || document.hidden) return;
      activeSlot = (activeSlot + 1) % queue.length;
      previewCard(queue[activeSlot]);
      rotationTimer = setTimeout(nextPreview, PREVIEW_MS);
    }

    function startRotation() {
      if (userTookOver || reducedMotion.matches || openedAsFile) return;
      if (!cards.some(card => card.autoplay)) return;
      activeSlot = -1;
      nextPreview();
    }

    function playFull(card) {
      if (card.kind === "drive") {
        openPlayerModal(card);
        return;
      }
      userTookOver = true;
      stopRotation();
      cards.forEach(stopCard);
      card.root.classList.add("is-active");
      if (card.preview && card.kind !== "youtube") {
        const v = localVideo(card.preview, card.title, false);
        card.media = v;
        showPlayer(card, v);
        v.play().catch(() => { });
        return;
      }
      if (card.kind === "youtube") {
        showPlayer(card, youtubeFrame(card.youtubeId, card.start || 0, {
          title: card.title,
          muted: false,
          controls: true
        }));
      }
    }

    function openPlayerModal(card) {
      userTookOver = true;
      stopRotation();
      cards.forEach(stopCard);
      playerModalTitle.textContent = card.title;
      playerModalStage.replaceChildren(driveFrame(card.fileId, card.title));
      playerModal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closePlayerModal() {
      playerModal.hidden = true;
      document.body.style.overflow = "";
      playerModalStage.replaceChildren();
    }

    playerModal.addEventListener("click", (e) => {
      if (e.target.closest("[data-close-modal]")) closePlayerModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !playerModal.hidden) closePlayerModal();
    });

    // 建立卡片
    works.forEach((w, i) => {
      const card = {
        title: w.title,
        platform: w.platform,
        preview: w.preview || "",
        kind: "",
        youtubeId: null,
        fileId: null,
        folder: false,
        start: 0,
        autoplay: false,
        media: null,
        root: el("article", "card"),
        visual: el("div", "visual")
      };
      if (w.platform === "youtube") card.youtubeId = youtubeId(w.url);
      if (w.platform === "drive") {
        card.fileId = driveFileId(w.url);
        card.folder = !card.fileId && !!driveFolderId(w.url);
      }
      if (card.youtubeId) {
        card.kind = "youtube";
        card.start = youtubeStart(w.url);
        card.autoplay = true;
      } else if (card.fileId) card.kind = "drive";
      else if (card.preview) card.kind = "mp4";
      if (card.preview) card.autoplay = true;

      const body = el("div", "card-body");
      body.append(
        el("div", "type", (i + 1).toString().padStart(2, "0") + " · " + w.platform.toUpperCase()),
        el("h3", "", w.title),
        el("p", "", w.description)
      );
      const actions = el("div", "actions");
      if (w.url) {
        const a = el("a", "", w.platform === "drive" ? "開啟 Drive 作品 ↗" : "觀看完整影片 ↗");
        a.href = w.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        actions.append(a);
      } else {
        actions.append(el("span", "", "尚未設定連結"));
      }
      if (card.kind === "youtube" || card.kind === "drive" || card.kind === "mp4") {
        const btn = el("button", "", "在此播放");
        btn.type = "button";
        btn.addEventListener("click", () => playFull(card));
        actions.append(btn);
        card.visual.addEventListener("click", () => {
          if (card.visual.classList.contains("playable")) playFull(card);
        });
      }
      body.append(actions);
      paintCover(card);
      card.root.append(card.visual, body);
      gallery.append(card.root);
      cards.push(card);
    });

    // 調整 3：過濾按鈕點擊事件邏輯
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentFilter = e.target.getAttribute("data-filter");

        stopRotation();
        cards.forEach(card => stopCard(card));

        cards.forEach((card, index) => {
          const platform = works[index].platform;
          if (currentFilter === "all" || platform === currentFilter) {
            card.root.style.display = "";
          } else {
            card.root.style.display = "none";
          }
        });

        startRotation();
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopRotation();
        if (!userTookOver) cards.forEach(card => { if (card.root.classList.contains("is-active")) stopCard(card); });
      } else if (!userTookOver) startRotation();
    });
    reducedMotion.addEventListener?.("change", () => {
      if (reducedMotion.matches) {
        userTookOver = true;
        stopRotation();
        cards.forEach(stopCard);
      }
    });
    startRotation();
  </script>
</body>

</html>
